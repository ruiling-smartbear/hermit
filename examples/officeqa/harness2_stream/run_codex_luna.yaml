# Harness² under the paper's own protocol on the Flash row with GPT-5.6-Luna (the README's second column):
# run_codex.yaml with the models changed and nothing else of the protocol. Executor and editors are GPT-5.6-Luna at
# medium effort on the machine's ChatGPT login: the executor through Codex's built-in provider (backend codexplan: no
# API key; each session gets a fresh copy of the login, ../utils/agent/codex_login.py), the editors as Codex sessions
# too (`evolver.params.backend: codex`, codex_proposer.py in place of Claude Code's `claude -p`, which the login cannot
# serve), reaching chatgpt.com through the run's allowlist proxy. The image holds the machine's own standalone Codex
# (OFFICEQA_CODEX_IMAGE=officeqa-codex:0.164.0, ../utils/agent/docker/Dockerfile.standalone) and the egress proxy lets
# through chatgpt.com only (OFFICEQA_CODEX_PROXY=http://oq-egress-chatgpt:3128). Started by launch.sh with
# CONFIG=run_codex_luna.yaml, which pins a copy of the machine's Codex for the editors (`evolver.params.claude_bin`)
# instead of a wire meter and a copy of Claude Code.
backends:
  codexplan: {base_url: "https://chatgpt.com/backend-api/codex", key_required: false, api_key_env: null, apis: [chat, responses]}
data:
  tasks: ../utils/tasks.jsonl
  train: stream_s0.txt                 # launch.sh: upstream's order of ../utils/splits/test.txt for SEED
  step_size: 1                         # one question per step
  shuffle: false                       # the stream's own order
task_info: ../utils/task-info
agent:
  name: ../utils/agent/codex_agent.py:OfficeQACodexAgent
  concurrency: 2                       # the INV and DOM probes of a question run side by side
  params:
    model: codexplan/gpt-5.6-luna      # a backend at ChatGPT's Codex endpoint: the session runs on the login
    effort: medium
    timeout_s: 3600                    # one session's wall clock, as the paper's rollouts
    codex_dir: ~/.cache/hermit/officeqa-h2-codex-luna
judge:
  path: ../utils/judge.py
template: harness2-codex@1.0
start_from: seed_adapter_codex         # H0 (launch.sh runs make_seed_codex.py)
evolver:
  name: harness2_upstream
  params:
    model: codexplan/gpt-5.6-luna      # the editors' model, on the login
    backend: codex                     # the editors are Codex sessions: codex_proposer.py
    proposer: codex_proposer.py:CodexProposer
    effort: medium
    k: 1
    slots: slots_codex.yaml            # names the answer's form (the value alone) and Codex's levers
    sources: sources.py:task_files
    name: officeqa
    leak_globs: ["answers.jsonl", "*.csv", "data.json"]  # not "*private*": "privately held debt" is a skill topic
    verdict_markers: ["' but expected '"]                # the judge's feedback wording
    probe_absent: []                                     # launch.sh: the answer files no session may see
sandbox:
  enabled: true
  network: restricted
  allow: [chatgpt.com]                 # the editor sessions reach the login's backend through the run's proxy
  read: []
  env: []
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (codex_session.py)
trainer:
  run_name: luna-h2-s0
  output_dir: runs
  tree_dir: runs/trees/luna-h2-s0
  epochs: 1
  call_timeout_min: 360                # one question's sessions and executions (executions up to 60 min each), retries included
  save_freq: {steps: null, epochs: 1}
  budget: {usd: null, tokens: null, hours: null}   # the plan has no price per token: nothing to cap in USD
