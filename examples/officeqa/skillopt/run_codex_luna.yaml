# OfficeQA with the SkillOpt Evolver on the Flash row with GPT-5.6-Luna (the README's second column):
# run_codex_flash.yaml with the models changed and nothing else of the protocol. The acting model is Codex's built-in
# provider on the machine's ChatGPT login (backend codexplan: no API key; each session gets a fresh copy of the login,
# ../utils/agent/codex_login.py), and the learner is the same model through a relay that answers each chat-completions
# call with one Codex session (backend codexrelay: `python examples/officeqa/utils/agent/codex_chat.py --port 3671`,
# started first with the two variables below exported: its sessions use the same image and proxy). The image holds
# the machine's own standalone Codex (OFFICEQA_CODEX_IMAGE=officeqa-codex:0.164.0,
# ../utils/agent/docker/Dockerfile.standalone) and the egress proxy lets through chatgpt.com only
# (OFFICEQA_CODEX_PROXY=http://oq-egress-chatgpt:3128): the recipe's "The Flash row with GPT-5.6-Luna". The no-skill
# and initial-skill cells of that column are `hermit eval` on this config with `--adapter none` and
# `--adapter ../utils/seed_adapter`.
backends:
  codexplan: {base_url: "https://chatgpt.com/backend-api/codex", key_required: false, api_key_env: null, apis: [chat, responses]}
  codexrelay: {base_url: "http://127.0.0.1:3671/v1", key_required: false, api_key_env: null, apis: [chat]}
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  val: ../utils/splits/val.txt
  test: ../utils/splits/test.txt
  step_size: 40
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/agent.py:OfficeQAAgent
  params:
    harness: codex
    model: codexplan/gpt-5.6-luna      # a backend at ChatGPT's Codex endpoint: the session runs on the login (agent.py)
    codex_dir: ~/.cache/hermit/officeqa-codex-actor-luna   # the sessions' homes and rollouts, apart from the Flash row's
  concurrency: 8
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
start_from: ../utils/seed_adapter  # SkillOpt's initial OfficeQA skill
evolver:
  name: skillopt
  params:
    total_steps: 8
    minibatch_size: 8
    merge_batch_size: 8
    analyst_workers: 16
    learning_rate: 4
    min_learning_rate: 2
    lr_scheduler: cosine
    slow_update_samples: 20
    slow_update_gate: true        # the paper gates the slow update on validation
    use_meta_skill: true
    prompt_env: officeqa
    trajectory_view: paper        # trajectories as the paper-time analyst saw them
    promote_final: false          # the paper-time code hands back the best skill as is
    seed: 42
llm:                           # the optimizer: GPT-5.6-Luna at medium effort, the acting model, one Codex session per call
  model: codexrelay/gpt-5.6-luna
  extra_body: {reasoning_effort: medium}
  timeout: 3600                # a Codex session answers more slowly than a chat completion
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []
  env: []                    # the Evolver's model key variable is always passed; nothing else is
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (codex_sandbox.py)
trainer:
  run_name: luna-skillopt
  output_dir: runs
  tree_dir: runs/trees/luna-skillopt          # one adapter tree per run: runs can train side by side
  epochs: 4
  budget: {usd: null, hours: null}
  call_timeout_min: 360       # Codex sessions are slower
eval:
  repeats: 1                 # one pass over the test questions
