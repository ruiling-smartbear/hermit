# ReHarness under its paper's protocol on the Flash row with GPT-5.6-Luna (the README's second column):
# stream_codex.yaml with the models changed and nothing else of the protocol. The acting model is Codex's built-in
# provider on the machine's ChatGPT login (backend codexplan: no API key; each session gets a fresh copy of the login,
# ../utils/agent/codex_login.py), and the reflection and revision agents are the same model through a relay that
# answers each chat-completions call with one Codex session (backend codexrelay:
# `python examples/officeqa/utils/agent/codex_chat.py --port 3671`, started first with the two variables below
# exported: launch.sh exports them for the run only, and the relay's sessions use the same image and proxy). The
# embedding model stays Qwen3-Embedding-8B on Fireworks behind launch.sh's wire meter (the plan serves no embeddings). The image holds the
# machine's own standalone Codex (OFFICEQA_CODEX_IMAGE=officeqa-codex:0.164.0, ../utils/agent/docker/
# Dockerfile.standalone) and the egress proxy lets through chatgpt.com only (OFFICEQA_CODEX_PROXY=
# http://oq-egress-chatgpt:3128). Started by `launch.sh stream_codex_luna`; the stream's accuracy is the mean of the
# steps' rollout scores (steps.jsonl); no `hermit eval` follows.
backends:
  codexplan: {base_url: "https://chatgpt.com/backend-api/codex", key_required: false, api_key_env: null, apis: [chat, responses]}
  codexrelay: {base_url: "http://127.0.0.1:3671/v1", key_required: false, api_key_env: null, apis: [chat]}
data:
  tasks: ../utils/tasks.jsonl
  train: stream_s0.txt                 # upstream Harness²'s seed-0 order of ../utils/splits/test.txt
  step_size: 1                         # one question per step: one ReHarness instance (read, revise, write)
  shuffle: false                       # the stream's own order
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/codex_agent.py:OfficeQACodexAgent
  concurrency: 1                       # one question at a time, and there is no eval
  params:
    model: codexplan/gpt-5.6-luna      # a backend at ChatGPT's Codex endpoint: the session runs on the login
    effort: medium
    timeout_s: 3600                    # one session's wall clock, as the Harness² and Continual Harness streams
    codex_dir: ~/.cache/hermit/officeqa-rh-codex-luna
    project_doc_max_bytes: 204800           # 200 KiB: five retrieved reflections exceed Codex's default 32 KiB,
                                             # past which it silently drops the rest of AGENTS.md
judge:
  path: ../utils/judge.py
template: reharness
start_from: seed_adapter               # make_seed.py: SkillOpt's initial skill over the reharness template, an empty bank
evolver:
  name: reharness
  params:
    k: 5                               # reflections retrieved and revised per question (the paper: 5)
    embedding: fireworks/accounts/fireworks/models/qwen3-embedding-8b   # launch.sh binds it to its loopback relay
    feedback: false                    # trajectory and answer only: no verdict reaches the agents (the row's footing)
llm:                                   # the reflection and revision agents: the acting model, one Codex session per call
  model: codexrelay/gpt-5.6-luna
  extra_body: {reasoning_effort: medium}
  timeout: 3600                        # a Codex session answers more slowly than a chat completion
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []
  env: []                    # the Evolver's model key variable is always passed; nothing else is
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (codex_session.py)
trainer:
  run_name: luna-rh-s0
  output_dir: runs
  tree_dir: runs/trees/luna-rh-s0      # one adapter tree per run: runs can train side by side
  epochs: 1                            # one pass over the stream
  save_freq: {steps: null, epochs: 1}
  budget: {usd: null, tokens: null, hours: null}   # the plan has no price per token: nothing to cap in USD
  call_timeout_min: 120                # one question's session (up to 60 min), five revisions side by side, one reflection
eval:
  repeats: 1                           # not used: the stream's own answers are the result
